name: Real-world test report
description: 提交一次真实、连续、已脱敏的 Beta 试用结果
title: "[Field Test]: "
labels:
  - field-test
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢参与真实试用。请只提交完成判断所需的最小证据，并保护自己与他人的隐私。
  - type: input
    id: version
    attributes:
      label: Skill 版本
      placeholder: v0.1.0-beta.1 或 commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 宿主、客户端版本、模型与操作系统
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: 真实任务类型
      options:
        - 流程
        - 判断
        - 表达与经验
        - 确定性规格或工具
        - 知识与资料
        - 复合任务
        - 不确定
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 脱敏后的任务概述
      description: 不要提供完整私人材料
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: 实际连续流程
      description: 说明完成了哪些阶段、在哪里停止或返工
    validations:
      required: true
  - type: dropdown
    id: adopted
    attributes:
      label: 最终候选是否采用
      options:
        - 直接采用
        - 修改后采用
        - 仅方向可用
        - 未采用
        - 尚未走到候选
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: 重复提问、确认负担与返工
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 权限、路径、隐私或状态问题
      description: 没有问题也请填写“未发现”
    validations:
      required: true
  - type: textarea
    id: priority
    attributes:
      label: 最值得优先修复的一个问题
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我已经删除凭据、联系方式、私人路径、客户资料和未脱敏对话
          required: true
        - label: 我没有把合成案例或静态检查描述成真实业务结果
          required: true
